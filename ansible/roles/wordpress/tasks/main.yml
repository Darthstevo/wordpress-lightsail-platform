---
- name: Ensure WordPress document root exists
  ansible.builtin.file:
    path: "{{ wp_docroot }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Download and extract WordPress
  ansible.builtin.unarchive:
    src: https://wordpress.org/latest.tar.gz
    dest: "{{ wp_docroot }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "{{ wp_docroot }}/wp-settings.php"

- name: Template wp-config.php
  ansible.builtin.template:
    src: wp-config.php.j2
    dest: "{{ wp_docroot }}/wp-config.php"
    owner: www-data
    group: www-data
    mode: "0640"

- name: Ensure WordPress permissions
  ansible.builtin.file:
    path: "{{ wp_docroot }}"
    state: directory
    recurse: true
    owner: www-data
    group: www-data
    mode: "0755"
